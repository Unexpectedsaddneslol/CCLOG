<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Typst PDF">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<title>Typst — редактор PDF-отчётов</title>
<style>
  :root { --bg:#fff; --fg:#111; --muted:#777; --line:#ddd; --bar:#000; --barfg:#fff; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 16px/1.4 -apple-system, "Helvetica Neue", Arial, sans-serif;
    color: var(--fg); background: var(--bg);
    display: flex; flex-direction: column;
    padding-bottom: env(safe-area-inset-bottom);
  }
  header {
    background: var(--bar); color: var(--barfg);
    padding: calc(8px + env(safe-area-inset-top)) 12px 8px;
    display: flex; align-items: center; gap: 8px;
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; flex: 1; letter-spacing: .02em; }
  button, .btn {
    font: inherit; font-size: 16px; border: 1px solid var(--fg); background: #fff; color: var(--fg);
    padding: 9px 14px; border-radius: 0; cursor: pointer; text-decoration: none; display: inline-block;
    -webkit-appearance: none; appearance: none;
  }
  button:active, .btn:active { background: #eee; }
  button.primary, .btn.primary { background: var(--fg); color: #fff; }
  header button { border-color: #fff; background: transparent; color: #fff; padding: 6px 12px; }
  header button.primary { background: #fff; color: #000; }
  button:disabled { opacity: .45; }

  nav { display: flex; border-bottom: 1px solid var(--line); }
  nav button { flex: 1; border: 0; border-bottom: 3px solid transparent; padding: 12px; background: #fff; }
  nav button.on { border-bottom-color: var(--fg); font-weight: 600; }

  main { flex: 1; min-height: 0; position: relative; }
  .pane { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; display: none; }
  .pane.on { display: block; }

  /* Правка */
  #edit { display: none; flex-direction: column; }
  #edit.on { display: flex; }
  .meta { padding: 10px 12px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .meta label { font-size: 12px; color: var(--muted); display: block; }
  .meta .full { grid-column: 1 / -1; }
  input[type=text], select {
    width: 100%; font: inherit; font-size: 16px; /* 16px — чтобы iOS не зумил при фокусе */
    border: 1px solid var(--line); border-radius: 0; padding: 9px 10px; background: #fff; color: var(--fg);
    -webkit-appearance: none; appearance: none;
  }
  .tools {
    display: flex; gap: 6px; overflow-x: auto; padding: 10px 12px; -webkit-overflow-scrolling: touch;
    position: sticky; top: 0; background: #fff; border-bottom: 1px solid var(--line); z-index: 1;
  }
  .tools button { padding: 7px 11px; white-space: nowrap; flex: none; }
  textarea#body {
    flex: 1; min-height: 50vh; width: 100%; border: 0; outline: 0; resize: none;
    padding: 12px; font: 16px/1.5 ui-monospace, "SF Mono", Menlo, monospace; color: var(--fg); background: #fff;
    border-radius: 0;
  }
  details.settings { padding: 0 12px 8px; }
  details.settings summary { color: var(--muted); font-size: 14px; padding: 8px 0; cursor: pointer; }
  .set-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .set-grid label { font-size: 12px; color: var(--muted); display: block; }

  /* Просмотр */
  #view { background: #e9e9e9; padding: 10px; }
  #pages svg { display: block; width: 100%; height: auto; background: #fff; margin: 0 0 10px; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
  #status { padding: 10px 12px; font-size: 14px; color: var(--muted); }
  #err { white-space: pre-wrap; font: 13px/1.4 ui-monospace, Menlo, monospace; color: #b00020; background: #fff; padding: 12px; margin: 0 0 10px; display: none; }
  #pdfbox { display: none; gap: 8px; padding: 10px 12px; background: #fff; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  #pdfbox.on { display: flex; }
  .hint { color: var(--muted); font-size: 13px; padding: 4px 12px 12px; }
</style>
</head>
<body>

<header>
  <h1>Typst · PDF-отчёт</h1>
  <button id="btnFile" type="button">Файл</button>
  <button id="btnPdf" class="primary" type="button">PDF</button>
</header>

<nav>
  <button id="tabEdit" class="on" type="button">Правка</button>
  <button id="tabView" type="button">Просмотр</button>
</nav>

<div id="pdfbox">
  <a id="pdfLink" class="btn primary" href="#" download="otchet.pdf">Скачать PDF</a>
  <button id="btnShare" type="button">Поделиться / в «Файлы»</button>
</div>

<main>
  <section id="edit" class="pane on">
    <div class="meta">
      <div class="full"><label for="title">Заголовок</label><input id="title" type="text" autocomplete="off" placeholder="Название отчёта"></div>
      <div><label for="author">Автор</label><input id="author" type="text" autocomplete="off"></div>
      <div><label for="date">Дата</label><input id="date" type="text" autocomplete="off"></div>
    </div>
    <details class="settings">
      <summary>Оформление</summary>
      <div class="set-grid">
        <div><label for="fs">Шрифт, pt</label>
          <select id="fs"><option>10</option><option>11</option><option selected>12</option><option>14</option><option>16</option></select></div>
        <div><label for="mg">Поля, мм</label>
          <select id="mg"><option>15</option><option selected>20</option><option>25</option><option>30</option></select></div>
        <div><label for="font">Шрифт</label>
          <select id="font"><option value="Libertinus Serif" selected>С засечками</option><option value="DejaVu Sans Mono">Моноширинный</option></select></div>
      </div>
    </details>
    <div class="tools" id="tools">
      <button type="button" data-ins="= |">Заголовок</button>
      <button type="button" data-ins="== |">Подзаг.</button>
      <button type="button" data-wrap="*">Жирный</button>
      <button type="button" data-wrap="_">Курсив</button>
      <button type="button" data-ins="- |">• Список</button>
      <button type="button" data-ins="+ |">1. Список</button>
      <button type="button" data-ins="#quote(block: true)[|]">Цитата</button>
      <button type="button" data-ins="#table(columns: 2,&#10;  [*Поле*], [*Значение*],&#10;  [|], [],&#10;)">Таблица</button>
      <button type="button" data-ins="#link(&quot;https://|&quot;)[ссылка]">Ссылка</button>
      <button type="button" data-ins="#line(length: 100%)&#10;|">Линия</button>
      <button type="button" data-ins="#pagebreak()&#10;|">Новая стр.</button>
    </div>
    <textarea id="body" spellcheck="true" autocapitalize="sentences" placeholder="Пишите текст отчёта здесь…"></textarea>
    <div class="hint">Разметка Typst: <code>= Заголовок</code>, <code>*жирный*</code>, <code>_курсив_</code>, <code>- список</code>. Абзацы разделяйте пустой строкой.</div>
  </section>

  <section id="view" class="pane">
    <div id="status"></div>
    <pre id="err"></pre>
    <div id="pages"></div>
  </section>
</main>

<input id="fileIn" type="file" accept=".typ,.txt,text/plain" hidden>

<script>
  // Версии библиотеки зафиксированы. Скрипт и wasm тянутся с jsDelivr при первом запуске
  // (~10 МБ в сжатом виде), дальше Safari берёт их из кеша.
  var V = "0.7.0";
  var CDN = "https://cdn.jsdelivr.net/npm/";
  var WASM_COMPILER = CDN + "@myriaddreamin/typst-ts-web-compiler@" + V + "/pkg/typst_ts_web_compiler_bg.wasm";
  var WASM_RENDERER = CDN + "@myriaddreamin/typst-ts-renderer@" + V + "/pkg/typst_ts_renderer_bg.wasm";
  var LIB = CDN + "@myriaddreamin/typst.ts@" + V + "/dist/esm/contrib/all-in-one-lite.bundle.js";
  window.__TYPST_URLS = { LIB: LIB, WASM_COMPILER: WASM_COMPILER, WASM_RENDERER: WASM_RENDERER };
</script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var KEY = "typst-editor-v1";

  /* ---------- состояние + автосохранение ---------- */
  var fields = ["title", "author", "date", "body", "fs", "mg", "font"];
  var DEFAULT_BODY =
    "= Введение\n\nЗдесь текст первого раздела. Абзацы разделяются пустой строкой.\n\n" +
    "== Выводы\n\n- первый пункт\n- второй пункт\n\nНекоторые слова можно сделать *жирными* или _курсивными_.\n";

  function load() {
    var s = null;
    try { s = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) {}
    s = s || { title: "Отчёт", author: "", date: new Date().toLocaleDateString("ru-RU"), body: DEFAULT_BODY };
    fields.forEach(function (f) { if (s[f] != null) $(f).value = s[f]; });
  }
  var saveT;
  function save() {
    clearTimeout(saveT);
    saveT = setTimeout(function () {
      var s = {}; fields.forEach(function (f) { s[f] = $(f).value; });
      try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {}
    }, 300);
  }

  /* ---------- сборка исходника Typst ---------- */
  function q(s) { return '"' + String(s).replace(/\\/g, "\\\\").replace(/"/g, '\\"') + '"'; }
  function buildSource() {
    var fs = $("fs").value, mg = $("mg").value, font = $("font").value;
    return [
      '#set page(paper: "a4", margin: ' + mg + 'mm, numbering: "1")',
      '#set text(font: (' + q(font) + ', "Libertinus Serif"), size: ' + fs + 'pt, lang: "ru")',
      '#set par(justify: true, leading: 0.7em)',
      '#show heading: set block(above: 1.4em, below: 0.8em)',
      '#let doc-title = ' + q($("title").value.trim()),
      '#let doc-author = ' + q($("author").value.trim()),
      '#let doc-date = ' + q($("date").value.trim()),
      '#if doc-title != "" [#align(center)[#text(size: 1.9em, weight: "bold")[#doc-title]]]',
      '#if doc-author != "" or doc-date != "" [#align(center)[#text(fill: luma(90))[#doc-author#if doc-author != "" and doc-date != "" [ · ]#doc-date]]]',
      '#if doc-title != "" or doc-author != "" [#v(1.2em)]',
      '',
      $("body").value
    ].join("\n");
  }

  /* ---------- загрузка Typst ---------- */
  var ready = null;
  function loadTypst() {
    if (ready) return ready;
    ready = new Promise(function (resolve, reject) {
      var u = window.__TYPST_URLS;
      var s = document.createElement("script");
      s.type = "module"; s.src = u.LIB;
      s.onload = function () {
        try {
          var t = window.$typst;
          t.setCompilerInitOptions({ getModule: function () { return u.WASM_COMPILER; } });
          t.setRendererInitOptions({ getModule: function () { return u.WASM_RENDERER; } });
          resolve(t);
        } catch (e) { reject(e); }
      };
      s.onerror = function () { reject(new Error("Не удалось загрузить Typst (нужен интернет при первом запуске).")); };
      document.head.appendChild(s);
    });
    ready.catch(function () { ready = null; });
    return ready;
  }
  function errText(e) {
    if (!e) return "Неизвестная ошибка";
    if (Array.isArray(e)) return e.map(errText).join("\n");
    if (e.message) return e.message;
    if (e.diagnostics) return errText(e.diagnostics);
    try { return typeof e === "string" ? e : JSON.stringify(e, null, 2); } catch (x) { return String(e); }
  }

  /* ---------- просмотр ---------- */
  var busy = false, again = false, dirty = true, viewOn = false;
  function setStatus(t) { $("status").textContent = t || ""; }
  async function render() {
    if (busy) { again = true; return; }
    busy = true; dirty = false;
    setStatus("Собираю…");
    try {
      var t = await loadTypst();
      var svg = await t.svg({ mainContent: buildSource() });
      $("err").style.display = "none";
      // SVG от компилятора содержит все страницы; показываем как есть
      $("pages").innerHTML = svg;
      setStatus("");
    } catch (e) {
      $("err").textContent = errText(e);
      $("err").style.display = "block";
      setStatus("Ошибка в разметке — см. ниже. Последний удачный вид сохранён.");
    }
    busy = false;
    if (again) { again = false; render(); }
  }
  var renderT;
  function scheduleRender() {
    dirty = true;
    $("pdfbox").classList.remove("on");
    if (!viewOn) return;
    clearTimeout(renderT);
    renderT = setTimeout(render, 700);
  }

  /* ---------- вкладки ---------- */
  function show(view) {
    viewOn = view;
    $("edit").classList.toggle("on", !view);
    $("view").classList.toggle("on", view);
    $("tabEdit").classList.toggle("on", !view);
    $("tabView").classList.toggle("on", view);
    if (view && dirty) render();
  }
  $("tabEdit").onclick = function () { show(false); };
  $("tabView").onclick = function () { show(true); };

  /* ---------- панель вставки ---------- */
  $("tools").addEventListener("click", function (ev) {
    var b = ev.target.closest("button"); if (!b) return;
    var ta = $("body"), a = ta.selectionStart, z = ta.selectionEnd, v = ta.value;
    var sel = v.slice(a, z), ins, caret;
    if (b.dataset.wrap) {
      var w = b.dataset.wrap;
      ins = w + (sel || "текст") + w; caret = a + ins.length;
    } else {
      var tpl = b.dataset.ins;
      // в начале строки вставляем с новой строки, если мы не в её начале
      var lead = (a > 0 && v[a - 1] !== "\n" && /^[=\-+#]/.test(tpl)) ? "\n" : "";
      var p = tpl.indexOf("|");
      var text = tpl.replace("|", sel);
      ins = lead + text;
      caret = a + lead.length + (p >= 0 ? p + sel.length : text.length);
    }
    ta.value = v.slice(0, a) + ins + v.slice(z);
    ta.focus(); ta.setSelectionRange(caret, caret);
    save(); scheduleRender();
  });

  fields.forEach(function (f) {
    $(f).addEventListener("input", function () { save(); scheduleRender(); });
    $(f).addEventListener("change", function () { save(); scheduleRender(); });
  });

  /* ---------- PDF ---------- */
  var pdfBlob = null, pdfUrl = null;
  function fname() {
    var n = ($("title").value || "otchet").trim().replace(/[\\/:*?"<>|]+/g, "").replace(/\s+/g, "_");
    return (n || "otchet") + ".pdf";
  }
  $("btnPdf").onclick = async function () {
    var b = $("btnPdf"); b.disabled = true; b.textContent = "…";
    try {
      var t = await loadTypst();
      var data = await t.pdf({ mainContent: buildSource() });
      if (pdfUrl) URL.revokeObjectURL(pdfUrl);
      pdfBlob = new Blob([data], { type: "application/pdf" });
      pdfUrl = URL.createObjectURL(pdfBlob);
      var a = $("pdfLink"); a.href = pdfUrl; a.download = fname();
      $("pdfbox").classList.add("on");
      $("btnShare").style.display = (navigator.canShare && navigator.canShare({ files: [new File([pdfBlob], fname(), { type: "application/pdf" })] })) ? "" : "none";
    } catch (e) {
      show(true);
      $("err").textContent = errText(e); $("err").style.display = "block";
    }
    b.disabled = false; b.textContent = "PDF";
  };
  $("btnShare").onclick = function () {
    if (!pdfBlob) return;
    var file = new File([pdfBlob], fname(), { type: "application/pdf" });
    navigator.share({ files: [file], title: fname() }).catch(function () {});
  };

  /* ---------- открыть / сохранить .typ ---------- */
  $("btnFile").onclick = function () {
    var m = confirm("OK — открыть .typ файл.\nОтмена — сохранить текущий текст как .typ.");
    if (m) { $("fileIn").click(); return; }
    var blob = new Blob([buildSource()], { type: "text/plain" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = fname().replace(/\.pdf$/, ".typ");
    document.body.appendChild(a); a.click(); a.remove();
  };
  $("fileIn").onchange = function () {
    var f = this.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      // загруженный файл целиком кладём в тело; оформление из формы тогда лучше пустить пустым
      $("body").value = String(r.result);
      $("title").value = ""; $("author").value = ""; $("date").value = "";
      save(); scheduleRender();
    };
    r.readAsText(f);
    this.value = "";
  };

  load();
  // Заранее подгружаем Typst в фоне, чтобы вкладка «Просмотр» открывалась быстрее
  setTimeout(function () { loadTypst().catch(function () {}); }, 500);
})();
</script>
</body>
</html>
